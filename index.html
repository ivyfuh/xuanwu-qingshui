<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清水段選屋系統 — 後台作業</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --cp:#fff;--cs:#f6f5f0;--ct:#eeede8;
  --tp:#1a1a18;--ts:#6b6a64;--tt:#9c9a92;
  --bt:rgba(0,0,0,.12);--bs:rgba(0,0,0,.28);
  --rm:8px;--rl:12px;
  --accent:#534AB7;--accent-bg:#EEEDFE;--accent-text:#3C3489;
  --green:#1D9E75;--green-bg:#E1F5EE;--green-text:#085041;
  --brand:#748B97;--brand-dark:#5F7682;--brand-bg:#E8EDF0;--brand-text:#3D4D56;
  --red:#E24B4A;--red-bg:#FCEBEB;--red-text:#791F1F;
  --orange:#EF9F27;--orange-bg:#FAEEDA;--orange-text:#633806;
}
@media(prefers-color-scheme:dark){
  :root{
    --cp:#1c1c1a;--cs:#242422;--ct:#2e2e2c;
    --tp:#e8e6de;--ts:#9c9a92;--tt:#6b6a64;
    --bt:rgba(255,255,255,.12);--bs:rgba(255,255,255,.28);
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;
  background:var(--ct);font-size:13px;color:var(--tp);}
input,button,select,textarea{font-family:inherit;font-size:13px;color:var(--tp);}
input,select,textarea{background:var(--cp);border:0.5px solid var(--bs);border-radius:var(--rm);
  padding:6px 10px;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(83,74,183,.15);}
button{cursor:pointer;border-radius:var(--rm);padding:6px 14px;border:none;font-weight:500;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.88;}
.btn-secondary{background:var(--cs);color:var(--tp);border:0.5px solid var(--bs);}
.btn-success{background:var(--green);color:#fff;}
.btn-danger{background:var(--red-bg);color:var(--red-text);border:0.5px solid var(--red);}
.card{background:var(--cp);border:0.5px solid var(--bt);border-radius:var(--rl);padding:16px;}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;
  padding:2px 8px;border-radius:10px;white-space:nowrap;}
.badge-ok    {background:var(--green-bg);color:var(--green-text);}
.badge-draft {background:#E6F1FB;color:#0C447C;}
.badge-dup   {background:var(--red-bg);color:var(--red-text);}
.badge-over  {background:var(--orange-bg);color:var(--orange-text);}
.badge-resel {background:var(--accent-bg);color:var(--accent-text);}

/* Layout */
#app{display:flex;flex-direction:column;min-height:100vh;}
#topbar{display:flex;align-items:center;padding:10px 16px;background:var(--cp);
  border-bottom:0.5px solid var(--bt);gap:10px;flex-shrink:0;position:sticky;top:0;z-index:100;}
#body{display:flex;flex:1;overflow:hidden;}
#sidebar{width:200px;background:var(--cs);border-right:0.5px solid var(--bt);
  display:flex;flex-direction:column;padding:8px 0;overflow-y:auto;flex-shrink:0;}
#main{flex:1;overflow:auto;padding:20px;}
#detail{display:none;width:300px;background:var(--cp);border-left:0.5px solid var(--bt);
  overflow-y:auto;padding:16px;flex-shrink:0;}

/* Sidebar */
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:13px;
  color:var(--ts);cursor:pointer;border-radius:8px;margin:1px 6px;transition:background .1s;}
.nav-item:hover,.nav-item.active{background:var(--cp);color:var(--tp);font-weight:500;}
.nav-section{font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tt);padding:10px 14px 4px;}

/* Table */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:var(--cs);padding:7px 12px;text-align:left;font-weight:500;color:var(--tt);
  border-bottom:0.5px solid var(--bt);white-space:nowrap;}
td{padding:8px 12px;border-bottom:0.5px solid var(--bt);vertical-align:middle;}
tr:hover td{background:var(--cs);}
tr.selected td{background:#EDF5FB;}

/* Test banner */
#test-banner{background:#FAEEDA;border-bottom:1px solid var(--orange);
  padding:6px 16px;font-size:12px;color:var(--orange-text);display:flex;
  align-items:center;gap:8px;}

/* Progress bar */
.pbar-bg{height:6px;background:var(--ct);border-radius:3px;overflow:hidden;}
.pbar-fill{height:100%;border-radius:3px;transition:width .3s;}

/* Modal */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);
  z-index:200;align-items:center;justify-content:center;}
#modal-overlay.open{display:flex;}
#modal-box{background:var(--cp);border-radius:var(--rl);padding:24px;
  width:100%;max-width:560px;max-height:90vh;overflow-y:auto;margin:16px;}

/* Util */
.flex{display:flex;}.gap-6{gap:6px;}.gap-8{gap:8px;}.gap-12{gap:12px;}
.flex-1{flex:1;}.items-center{align-items:center;}.justify-between{justify-content:space-between;}
.mb-4{margin-bottom:4px;}.mb-8{margin-bottom:8px;}.mb-12{margin-bottom:12px;}.mb-16{margin-bottom:16px;}
.text-sm{font-size:12px;}.text-xs{font-size:11px;}.text-muted{color:var(--tt);}
.font-medium{font-weight:500;}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.field-label{font-size:11px;color:var(--tt);margin-bottom:4px;}
.stat-card{background:var(--cs);border-radius:var(--rm);padding:12px 16px;text-align:center;}
.stat-n{font-size:24px;font-weight:500;margin-bottom:2px;}
.stat-l{font-size:11px;color:var(--tt);}
</style>
</head>
<body>
<div id="app">

  <!-- Test banner -->
  <div id="test-banner">
    <i class="ti ti-flask"></i>
    <strong>測試模式</strong> — 資料僅供測試，正式上線前請聯絡主管切換環境
    <span id="env-label" style="margin-left:auto;font-size:11px;opacity:.7;"></span>
  </div>

  <!-- Topbar -->
  <div id="topbar">
    <span style="font-weight:500;font-size:15px;">選屋系統</span>
    <span style="background:#F1EFE8;color:#444;padding:2px 8px;border-radius:8px;font-size:11px;" id="case-label">清水段</span>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
      <div id="google-signin" style="display:none;">
        <div id="g_id_onload" data-client_id="258934303476-a7he92qcfc7kcccbo317c746ljmodmd0.apps.googleusercontent.com"
          data-callback="onGoogleSignIn" data-auto_select="true" data-context="signin"></div>
        <div class="g_id_signin" data-type="standard" data-size="medium" data-theme="outline" data-text="sign_in_with" data-shape="pill"></div>
      </div>
      <span id="user-label" style="font-size:11px;color:var(--tt);"></span>
      <button id="logout-btn" onclick="doLogout()" class="btn-secondary" style="display:none;font-size:12px;padding:4px 10px;">登出</button>
    </div>
  </div>

  <!-- Body -->
  <div id="body">

    <!-- Sidebar -->
    <div id="sidebar">
      <div style="padding:8px 14px 12px;border-bottom:0.5px solid var(--bt);margin-bottom:6px;">
        <div class="text-xs text-muted mb-4">選配進度</div>
        <div class="flex justify-between text-sm mb-4"><span class="text-muted">完成</span><span id="sb-done" style="font-weight:500;color:var(--green-text);">—</span></div>
        <div class="flex justify-between text-sm mb-4"><span class="text-muted">重複</span><span id="sb-dup" style="font-weight:500;color:var(--red-text);">—</span></div>
        <div class="flex justify-between text-sm"><span class="text-muted">待回電</span><span id="sb-callback" style="font-weight:500;color:var(--orange-text);">—</span></div>
      </div>
      <div class="nav-section">選配作業</div>
      <div class="nav-item active" id="nav-list" onclick="navTo('list')"><i class="ti ti-clipboard-list"></i>地主清單</div>
      <div class="nav-item" id="nav-merge" onclick="navTo('merge')"><i class="ti ti-users"></i>合併管理</div>
      <div class="nav-item" id="nav-lottery" onclick="navTo('lottery')"><i class="ti ti-dice"></i>重複/抽籤</div>
      <div class="nav-item" id="nav-calls" onclick="navTo('calls')"><i class="ti ti-phone"></i>電話記錄</div>
      <div class="nav-item" id="nav-announce" onclick="navTo('announce')"><i class="ti ti-speakerphone"></i>公告管理</div>
      <div class="nav-section">報表</div>
      <div class="nav-item" id="nav-settle" onclick="navTo('settle')"><i class="ti ti-coin"></i>找補彙總</div>
      <div class="nav-item" id="nav-export" onclick="doExport()"><i class="ti ti-table-export"></i>匯出報告書</div>
      <div style="flex:1;"></div>
      <div style="border-top:0.5px solid var(--bt);padding:6px 6px 0;">
        <div class="nav-item" id="nav-settings" onclick="navTo('settings')"><i class="ti ti-settings"></i>案件設定</div>
      </div>
    </div>

    <!-- Main content -->
    <div id="main">

      <!-- ===== LIST VIEW ===== -->
      <div id="view-list">
        <!-- Top bar -->
        <div class="flex items-center gap-8 mb-16" style="flex-wrap:wrap;">
          <input type="text" id="search" placeholder="搜尋地主姓名 / 編號…"
            style="width:200px;" oninput="filterOwners()">
          <button class="btn-secondary text-sm" id="f-all"  onclick="setFilter('')">全部</button>
          <button class="btn-secondary text-sm" id="f-dup"  onclick="setFilter('dup')"  style="color:var(--red-text);">重複</button>
          <button class="btn-secondary text-sm" id="f-over" onclick="setFilter('over')" style="color:var(--orange-text);">超選</button>
          <button class="btn-secondary text-sm" id="f-draft" onclick="setFilter('draft')" style="color:#0C447C;">草稿</button>
          <button class="btn-secondary text-sm" id="f-mine" onclick="setFilter('mine')">我的</button>
          <button class="btn-secondary text-sm" id="f-incomplete" onclick="setFilter('incomplete')" style="color:var(--red-text);">收件未齊</button>
          <button class="btn-primary" onclick="openOwnerModal(null)" style="margin-left:auto;">
            <i class="ti ti-plus"></i> 新增地主
          </button>
        </div>

        <!-- Stats row -->
        <div class="grid-2 mb-16" style="grid-template-columns:repeat(4,1fr);">
          <div class="stat-card"><div class="stat-n" id="st-total" style="color:var(--accent);">—</div><div class="stat-l">地主總數</div></div>
          <div class="stat-card"><div class="stat-n" id="st-confirmed" style="color:var(--green-text);">—</div><div class="stat-l">正式登錄</div></div>
          <div class="stat-card"><div class="stat-n" id="st-dup" style="color:var(--red-text);">—</div><div class="stat-l">有重複</div></div>
          <div class="stat-card"><div class="stat-n" id="st-over" style="color:var(--orange-text);">—</div><div class="stat-l">超過110%</div></div>
        </div>

        <!-- Table -->
        <div class="card" style="padding:0;overflow:hidden;">
          <!-- Table header -->
          <div style="display:grid;grid-template-columns:60px 1fr 90px 100px 60px 28px;
            padding:7px 14px;background:var(--cs);gap:8px;border-bottom:0.5px solid var(--bt);">
            <span class="text-xs text-muted font-medium">編號</span>
            <span class="text-xs text-muted font-medium">地主</span>
            <span class="text-xs text-muted font-medium">狀態</span>
            <span class="text-xs text-muted font-medium">使用率</span>
            <span class="text-xs text-muted font-medium">負責</span>
            <span></span>
          </div>
          <div id="owner-rows"></div>
        </div>
      </div>

      <!-- ===== CALL LOG VIEW ===== -->
      <div id="view-calls" style="display:none;">
        <div class="flex items-center justify-between mb-16">
          <h2 style="font-size:16px;font-weight:500;">電話聯絡記錄</h2>
          <button class="btn-primary" onclick="openCallModal(null)">
            <i class="ti ti-phone-plus"></i> 記錄通話
          </button>
        </div>
        <div class="card" style="padding:0;overflow:hidden;">
          <div id="call-rows" style="min-height:200px;"></div>
        </div>
      </div>

      <!-- ===== ANNOUNCEMENT VIEW ===== -->
      <div id="view-announce" style="display:none;">
        <div class="flex items-center justify-between mb-16">
          <h2 style="font-size:16px;font-weight:500;">公告管理</h2>
          <button class="btn-primary" onclick="openAnnounceModal()">
            <i class="ti ti-plus"></i> 新增公告
          </button>
        </div>
        <div class="text-xs text-muted mb-12">公告會即時顯示在地主查閱頁最上方。重要程度分為通知 / 公告 / 重要三級。</div>
        <div id="announce-list"></div>
      </div>

      <!-- ===== OTHER VIEWS placeholder ===== -->
      <div id="view-merge"    style="display:none;padding:60px;text-align:center;color:var(--tt);">
        <i class="ti ti-users" style="font-size:40px;display:block;margin-bottom:12px;"></i>
        <div style="font-size:15px;">合併管理 — Phase 2</div>
      </div>
      <div id="view-lottery"  style="display:none;padding:60px;text-align:center;color:var(--tt);">
        <i class="ti ti-dice" style="font-size:40px;display:block;margin-bottom:12px;"></i>
        <div style="font-size:15px;">抽籤管理 — Phase 2</div>
      </div>
      <div id="view-settle"   style="display:none;padding:60px;text-align:center;color:var(--tt);">
        <i class="ti ti-coin" style="font-size:40px;display:block;margin-bottom:12px;"></i>
        <div style="font-size:15px;">找補彙總 — Phase 2</div>
      </div>
      <div id="view-settings" style="display:none;">
        <h2 style="font-size:16px;font-weight:500;margin-bottom:16px;">案件設定</h2>
        <div class="card" id="settings-content"></div>
      </div>

    </div><!-- /main -->

    <!-- Detail Panel -->
    <div id="detail">
      <div id="detail-content"></div>
    </div>

  </div><!-- /body -->
</div><!-- /app -->

<!-- ===== OWNER/SELECTION MODAL ===== -->
<div id="modal-overlay">
  <div id="modal-box">
    <div class="flex items-center justify-between mb-16">
      <h3 id="modal-title" style="font-size:15px;font-weight:500;">新增地主</h3>
      <button onclick="closeModal()" class="btn-secondary" style="padding:4px 8px;">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ============================================================
//  CONFIG — Change before deploy
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbz2oTXAMAVHdMBmtk5y3wJQRQ03Rf5y6AbG5K79wRuIpQIihENevTDRADcTnc99CZ4MPg/exec';
const CLIENT_ID = '258934303476-a7he92qcfc7kcccbo317c746ljmodmd0.apps.googleusercontent.com';

// ============================================================
//  STATE
// ============================================================
let USER = null;  // { email, token }
let STATE = {
  owners: [], selections: [], callLog: [],
  filter: '', search: '', selected_owner_id: null,
  caseConfig: {},
  docStatus: {},   // { owner_id: { docType: true } }
};

// 收件文件類型（上傳即視為已收）
// needAgent: 只有有代理人才需要 | selectOnly: 只有參與選配才需要
const DOC_TYPES = [
  { key: '都更同意書',     needAgent: false, selectOnly: false },
  { key: '防災都更同意書', needAgent: false, selectOnly: false },
  { key: '意願調查表',     needAgent: false, selectOnly: false },
  { key: '選配申請書',     needAgent: false, selectOnly: true  },
  { key: '本人證件',       needAgent: false, selectOnly: false },
  { key: '代理人證件',     needAgent: true,  selectOnly: false },
  { key: '授權書',         needAgent: true,  selectOnly: false },
];

// 依地主屬性篩出需要的收件項目
function requiredDocsFor(owner) {
  const hasAgent    = owner && (owner.has_agent === true || owner.has_agent === 'true');
  const participate = !owner || (owner.participate !== false && owner.participate !== 'false');
  return DOC_TYPES.filter(dt => {
    if (dt.needAgent && !hasAgent) return false;
    if (dt.selectOnly && !participate) return false;
    return true;
  });
}

// ============================================================
//  AUTH
// ============================================================
function onGoogleSignIn(response) {
  const token = response.credential;
  const payload = parseJwt(token);
  USER = { email: payload.email, token };
  document.getElementById('user-label').textContent = payload.email;
  document.getElementById('logout-btn').style.display = '';
  document.getElementById('google-signin').style.display = 'none';
  loadAll();
}

function doLogout() {
  USER = null;
  document.getElementById('user-label').textContent = '';
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('google-signin').style.display = '';
  document.getElementById('owner-rows').innerHTML = '<div style="padding:40px;text-align:center;color:var(--tt);">請先登入</div>';
}

function parseJwt(token) {
  const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  return JSON.parse(atob(base64));
}

function authHeader() {
  return USER ? { 'Content-Type': 'application/json' } : {};
}

// ============================================================
//  API CALLS
// ============================================================
async function apiGet(action, params = {}) {
  const qs = new URLSearchParams({ action, token: USER?.token || '', ...params });
  const res = await fetch(`${API_URL}?${qs}`);
  const d = await res.json();
  if (d.status !== 'ok') throw new Error(d.data?.error || 'API error');
  return d.data;
}

async function apiPost(action, body = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, auth: { token: USER?.token, email: USER?.email }, ...body }),
  });
  const d = await res.json();
  if (d.status !== 'ok') throw new Error(d.data?.error || 'API error');
  return d.data;
}

// ============================================================
//  DATA LOADING
// ============================================================
async function loadAll() {
  await loadCaseConfig();
  await Promise.all([loadOwners(), loadSelections(), loadDocStatus()]);
  renderOwnerList();
  updateSidebar();
}

async function loadDocStatus() {
  try { STATE.docStatus = await apiGet('getDocStatus') || {}; }
  catch(e) { console.error('loadDocStatus', e); STATE.docStatus = {}; }
}

function ownerDocProgress(ownerId) {
  const has = STATE.docStatus[ownerId] || {};
  const owner = STATE.owners.find(o => o.owner_id == ownerId);
  const required = requiredDocsFor(owner);
  const done = required.filter(dt => has[dt.key]).length;
  const missing = required.filter(dt => !has[dt.key]).map(dt => dt.key);
  return { done, total: required.length, missing };
}

function docProgressBadge(ownerId) {
  const prog = ownerDocProgress(ownerId);
  if (prog.done === prog.total) {
    return `<span style="font-size:10px;color:var(--green-text);background:var(--green-bg);padding:0 6px;border-radius:6px;">收件齊全</span>`;
  }
  return `<span style="font-size:10px;color:var(--red-text);background:var(--red-bg);padding:0 6px;border-radius:6px;" title="缺：${prog.missing.join('、')}">收件 ${prog.done}/${prog.total}</span>`;
}

async function loadCaseConfig() {
  try {
    STATE.caseConfig = await apiGet('getCase');
    const cfg = STATE.caseConfig;
    document.getElementById('case-label').textContent = cfg.case_name || '清水段';
    const isTest = cfg.env === 'test';
    document.getElementById('test-banner').style.display = isTest ? '' : 'none';
    document.getElementById('env-label').textContent = isTest ? '⚠️ TEST 模式' : '✓ PRODUCTION';
  } catch(e) { console.error('loadCaseConfig', e); }
}

async function loadOwners() {
  try { STATE.owners = await apiGet('getOwners'); }
  catch(e) { console.error('loadOwners', e); }
}

async function loadSelections() {
  try { STATE.selections = await apiGet('getSelections'); }
  catch(e) { console.error('loadSelections', e); }
}

async function loadCallLog() {
  try { STATE.callLog = await apiGet('getCallLog'); }
  catch(e) { console.error('loadCallLog', e); }
}

// ============================================================
//  OWNER LIST RENDERING
// ============================================================
function getSelForOwner(ownerId) {
  return STATE.selections.find(s => s.owner_id == ownerId && s.status !== 'deleted') || null;
}

function ownerStatus(owner, sel) {
  if (!sel) return 'none';
  if (sel.is_over_limit) return 'over';
  // check duplicate
  const hasDup = checkDuplicate(sel);
  if (hasDup) return 'dup';
  if (sel.status === 'draft') return 'draft';
  if (sel.status === 'needs_reselect') return 'resel';
  return 'ok';
}

function checkDuplicate(sel) {
  const myUnits = Array.isArray(sel.unit_nos) ? sel.unit_nos : JSON.parse(sel.unit_nos || '[]');
  const myParks = Array.isArray(sel.parking_nos) ? sel.parking_nos : JSON.parse(sel.parking_nos || '[]');
  for (const s of STATE.selections) {
    if (s.sel_id === sel.sel_id || s.status === 'deleted') continue;
    const otherUnits = Array.isArray(s.unit_nos) ? s.unit_nos : JSON.parse(s.unit_nos || '[]');
    const otherParks = Array.isArray(s.parking_nos) ? s.parking_nos : JSON.parse(s.parking_nos || '[]');
    if (myUnits.some(u => otherUnits.includes(u))) return true;
    if (myParks.some(p => otherParks.includes(p))) return true;
  }
  return false;
}

function setFilter(f) {
  STATE.filter = f;
  document.querySelectorAll('[id^=f-]').forEach(b => {
    b.style.background = '';
    b.style.fontWeight = '';
  });
  const active = document.getElementById('f-' + (f || 'all'));
  if (active) { active.style.background = 'var(--cs)'; active.style.fontWeight = '500'; }
  renderOwnerList();
}

function filterOwners() {
  STATE.search = document.getElementById('search').value;
  renderOwnerList();
}

function renderOwnerList() {
  const q = STATE.search.toLowerCase();
  const f = STATE.filter;

  let list = STATE.owners.filter(o => {
    if (q && !o.name?.toLowerCase().includes(q) && !String(o.serial_no||'').includes(q)) return false;
    const sel = getSelForOwner(o.owner_id);
    const st  = ownerStatus(o, sel);
    if (f === 'dup'   && st !== 'dup')   return false;
    if (f === 'over'  && st !== 'over')  return false;
    if (f === 'draft' && st !== 'draft') return false;
    if (f === 'mine'  && o.handler !== USER?.email?.split('@')[0]) return false;
    if (f === 'incomplete') { const p = ownerDocProgress(o.owner_id); if (p.done === p.total) return false; }
    return true;
  });

  // Stats
  const all  = STATE.owners;
  const sels = STATE.selections.filter(s => s.status !== 'deleted');
  document.getElementById('st-total').textContent     = all.length;
  document.getElementById('st-confirmed').textContent = sels.filter(s => s.status === 'confirmed').length;
  document.getElementById('st-dup').textContent       = sels.filter(s => checkDuplicate(s)).length;
  document.getElementById('st-over').textContent      = sels.filter(s => s.is_over_limit).length;

  const stMap = { ok:'badge-ok', draft:'badge-draft', dup:'badge-dup', over:'badge-over', resel:'badge-resel', none:'badge-draft' };
  const stLabel = { ok:'正式', draft:'草稿', dup:'重複', over:'超選', resel:'需改選', none:'未登記' };

  const rows = list.map(o => {
    const sel = getSelForOwner(o.owner_id);
    const st  = ownerStatus(o, sel);
    const limit = Number(o.upper_limit) || 0;
    const total = sel ? (Number(sel.total_value) || 0) : 0;
    const pct   = limit > 0 ? Math.min(100, Math.round(total / limit * 100)) : 0;
    const barColor = total > limit ? 'var(--red)' : pct > 90 ? 'var(--orange)' : 'var(--green)';
    const isActive = STATE.selected_owner_id == o.owner_id;

    return `<div style="display:grid;grid-template-columns:60px 1fr 90px 100px 60px 28px;
      align-items:center;padding:9px 14px;border-bottom:0.5px solid var(--bt);
      cursor:pointer;gap:8px;${isActive?'background:#EDF5FB;':''}"
      onclick="selectOwner('${o.owner_id}')" class="owner-row">
      <div style="font-size:12px;color:var(--tt);">${o.serial_no||''}</div>
      <div>
        <div style="font-weight:500;">${o.name||''}${(o.has_agent==='true'||o.has_agent===true)?' <span style="font-size:10px;color:var(--brand-text);background:var(--brand-bg);padding:0 5px;border-radius:6px;">代理</span>':''}${(o.participate==='false'||o.participate===false)?' <span style="font-size:10px;color:var(--tt);background:var(--cs);padding:0 5px;border-radius:6px;">不參與</span>':''}</div>
        <div class="text-xs" style="display:flex;align-items:center;gap:6px;">
          <span class="text-muted">${o.phone||''}</span>
          ${docProgressBadge(o.owner_id)}
        </div>
      </div>
      <div><span class="badge ${stMap[st]||''}">${stLabel[st]||st}</span></div>
      <div style="display:flex;align-items:center;gap:5px;">
        <div class="pbar-bg" style="flex:1;"><div class="pbar-fill" style="width:${pct}%;background:${barColor};"></div></div>
        <span class="text-xs text-muted">${pct}%</span>
      </div>
      <div class="text-xs text-muted">${o.handler||''}</div>
      <div><i class="ti ti-chevron-right" style="color:var(--tt);"></i></div>
    </div>`;
  }).join('');

  document.getElementById('owner-rows').innerHTML = rows ||
    '<div style="padding:40px;text-align:center;color:var(--tt);">無符合條件的地主</div>';
  updateSidebar();
}

function selectOwner(ownerId) {
  STATE.selected_owner_id = ownerId;
  renderOwnerList();  // highlight row
  renderOwnerDetail(ownerId);
  document.getElementById('detail').style.display = 'block';
}

function renderOwnerDetail(ownerId) {
  const owner = STATE.owners.find(o => o.owner_id == ownerId);
  const sel   = getSelForOwner(ownerId);
  if (!owner) return;

  const rights = Number(owner.rights_value) || 0;
  const limit  = Number(owner.upper_limit) || 0;
  const total  = sel ? (Number(sel.total_value) || 0) : 0;
  const settle = total - rights;
  const pct    = limit > 0 ? Math.min(100, Math.round(total / limit * 100)) : 0;
  const st     = ownerStatus(owner, sel);
  const barColor = total > limit ? 'var(--red)' : pct > 90 ? 'var(--orange)' : 'var(--green)';

  const stMap = { ok:'badge-ok', draft:'badge-draft', dup:'badge-dup', over:'badge-over', resel:'badge-resel', none:'badge-draft' };
  const stLabel = { ok:'正式', draft:'草稿', dup:'重複', over:'超選', resel:'需改選', none:'未登記' };

  const unitNos = sel ? (Array.isArray(sel.unit_nos) ? sel.unit_nos : JSON.parse(sel.unit_nos||'[]')) : [];
  const parkNos = sel ? (Array.isArray(sel.parking_nos) ? sel.parking_nos : JSON.parse(sel.parking_nos||'[]')) : [];

  // Warning banners
  let warn = '';
  if (st === 'dup')   warn = `<div style="background:var(--red-bg);border:0.5px solid var(--red);border-radius:var(--rm);padding:8px 10px;font-size:11px;color:var(--red-text);margin-bottom:10px;"><i class="ti ti-alert-circle"></i> 選配戶別或車位有重複，需抽籤</div>`;
  if (st === 'over')  warn = `<div style="background:var(--orange-bg);border:0.5px solid var(--orange);border-radius:var(--rm);padding:8px 10px;font-size:11px;color:var(--orange-text);margin-bottom:10px;"><i class="ti ti-alert-triangle"></i> 超選 NT$${fmt(total - limit)}</div>`;
  if (st === 'resel') warn = `<div style="background:var(--accent-bg);border:0.5px solid var(--accent);border-radius:var(--rm);padding:8px 10px;font-size:11px;color:var(--accent-text);margin-bottom:10px;"><i class="ti ti-refresh"></i> 抽籤落選，需重新選配</div>`;

  const unitRows = unitNos.map(u => `<div class="flex justify-between text-sm" style="padding:4px 0;border-bottom:0.5px solid var(--bt);">
    <span style="font-weight:500;">🏠 ${u}</span>
  </div>`).join('') || '<div class="text-xs text-muted" style="padding:4px 0;">未選擇戶別</div>';

  const parkRows = parkNos.map(p => `<div class="flex justify-between text-sm" style="padding:4px 0;border-bottom:0.5px solid var(--bt);">
    <span>🚗 ${p}</span>
  </div>`).join('') || '<div class="text-xs text-muted" style="padding:4px 0;">未選擇車位</div>';

  document.getElementById('detail-content').innerHTML = `
    <div class="flex items-center justify-between mb-12">
      <div>
        <div style="font-size:16px;font-weight:500;">${owner.name||''}</div>
        <div class="text-xs text-muted mt-1">編號 ${owner.serial_no||''} · ${owner.handler||''}</div>
      </div>
      <div class="flex gap-6 items-center">
        <span class="badge ${stMap[st]||''}">${stLabel[st]||''}</span>
        <button onclick="document.getElementById('detail').style.display='none'" class="btn-secondary" style="padding:3px 7px;">✕</button>
      </div>
    </div>

    ${warn}

    <div class="mb-12">
      <div class="text-xs text-muted mb-4">選配使用率</div>
      <div class="flex items-center gap-6 mb-4">
        <div class="pbar-bg" style="flex:1;height:8px;"><div class="pbar-fill" style="width:${pct}%;background:${barColor};height:8px;"></div></div>
        <span style="font-size:13px;font-weight:500;">${pct}%</span>
      </div>
      <div class="flex justify-between text-xs text-muted">
        <span>已選 NT$${fmt(total)}</span><span>上限 NT$${fmt(limit)}</span>
      </div>
    </div>

    <div class="mb-12">
      <div class="text-xs text-muted mb-4">找補</div>
      <div style="font-size:14px;font-weight:500;color:${settle>0?'var(--red-text)':settle<0?'var(--green-text)':'var(--tt)'};">
        ${settle>0?'需補差 NT$'+fmt(settle):settle<0?'退款 NT$'+fmt(-settle):'無需找補'}
      </div>
    </div>

    <div class="text-xs text-muted mb-4">選配內容</div>
    ${unitRows}${parkRows}

    ${(owner.participate==='false'||owner.participate===false) ? `
    <div style="background:var(--cs);border-radius:var(--rm);padding:10px 12px;margin-top:12px;font-size:12px;color:var(--ts);text-align:center;">
      <i class="ti ti-info-circle"></i> 此地主不參與選配（不願/不能領取更新前價值），無需選位置
    </div>
    <div class="flex gap-6 mt-12">
      <button class="btn-secondary flex-1" style="font-size:12px;" onclick="openCallModal('${ownerId}')">
        <i class="ti ti-phone"></i> 記錄通話
      </button>
      <button class="btn-secondary flex-1" style="font-size:12px;" onclick="openUploadModal('${ownerId}')">
        <i class="ti ti-upload"></i> 上傳文件
      </button>
    </div>
    ` : `
    <div class="flex gap-6 mt-12">
      <button class="btn-secondary flex-1" onclick="openSelectionModal('${ownerId}')">
        <i class="ti ti-pencil"></i> ${sel ? '改選' : '選配'}
      </button>
      ${sel?.status==='draft' ? `<button class="btn-success flex-1" onclick="confirmSelection('${ownerId}')">
        <i class="ti ti-check"></i> 正式登錄
      </button>` : ''}
    </div>
    <div class="flex gap-6 mt-6">
      <button class="btn-secondary flex-1" style="font-size:12px;" onclick="openCallModal('${ownerId}')">
        <i class="ti ti-phone"></i> 記錄通話
      </button>
      <button class="btn-secondary flex-1" style="font-size:12px;" onclick="openUploadModal('${ownerId}')">
        <i class="ti ti-upload"></i> 上傳文件
      </button>
    </div>
    ${sel ? `<button class="btn-primary" style="width:100%;margin-top:6px;font-size:12px;" onclick="printApplication('${ownerId}')">
      <i class="ti ti-printer"></i> 列印分配位置申請書
    </button>` : ''}
    `}

    ${renderDocChecklist(ownerId)}
  `;
}

function renderDocChecklist(ownerId) {
  const owner = STATE.owners.find(o => o.owner_id == ownerId);
  const has = STATE.docStatus[ownerId] || {};
  const prog = ownerDocProgress(ownerId);
  const items = requiredDocsFor(owner).map(dt => {
    const done = !!has[dt.key];
    return `<div class="flex items-center gap-6" style="padding:4px 0;font-size:12px;">
      <i class="ti ${done?'ti-circle-check-filled':'ti-circle'}" style="font-size:15px;color:${done?'var(--green)':'var(--tt)'};"></i>
      <span style="color:${done?'var(--tp)':'var(--tt)'};">${dt.key}</span>
      ${done?'':`<span style="margin-left:auto;font-size:10px;color:var(--red-text);">待補</span>`}
    </div>`;
  }).join('');
  const allDone = prog.done === prog.total;
  return `<div style="margin-top:16px;border-top:0.5px solid var(--bt);padding-top:12px;">
    <div class="flex items-center justify-between mb-8">
      <span class="text-xs text-muted font-medium">收件進度</span>
      <span style="font-size:12px;font-weight:500;color:${allDone?'var(--green-text)':'var(--orange-text)'};">${prog.done} / ${prog.total}</span>
    </div>
    ${items}
    <div class="text-xs text-muted" style="margin-top:6px;">上傳對應文件即自動標記為已收</div>
  </div>`;
}

function previewSelection(ownerId) {
  const owner  = STATE.owners.find(o => o.owner_id == ownerId);
  const units  = document.getElementById('sel-units').value.split(',').map(s=>s.trim()).filter(Boolean);
  const parks  = document.getElementById('sel-parks').value.split(',').map(s=>s.trim()).filter(Boolean);
  const rights = Number(owner?.rights_value)||0;
  const limit  = Number(owner?.upper_limit)||0;

  // Simple validation + calc
  let total = 0;
  document.getElementById('sel-validation').innerHTML = '<div class="text-xs text-muted">試算中…</div>';
  apiGet('getUnits').then(unitMap => {
    apiGet('getParking').then(parkMap => {
      let errs = [];
      units.forEach(u => {
        if (!unitMap[u]) errs.push(`戶別 ${u} 不存在`);
        else total += unitMap[u].total_value;
      });
      parks.forEach(p => {
        if (!parkMap[p]) errs.push(`車位 ${p} 不存在`);
        else total += parkMap[p].price;
      });
      const settle = total - rights;
      const over   = total > limit;
      let html = '';
      if (errs.length) {
        html = `<div style="background:var(--red-bg);color:var(--red-text);padding:8px 10px;border-radius:var(--rm);font-size:12px;">${errs.join('<br>')}</div>`;
      } else {
        html = `<div style="background:var(--cs);border-radius:var(--rm);padding:10px 12px;font-size:12px;">
          <div class="flex justify-between mb-4"><span class="text-muted">總選配價值</span><span style="font-weight:500;">NT$${fmt(total)}</span></div>
          <div class="flex justify-between mb-4"><span class="text-muted">選配上限</span><span>NT$${fmt(limit)}</span></div>
          <div class="flex justify-between mb-4"><span class="text-muted">找補</span>
            <span style="font-weight:500;color:${settle>0?'var(--red-text)':settle<0?'var(--green-text)':'var(--tt)'};">
              ${settle>0?'繳 NT$'+fmt(settle):settle<0?'領 NT$'+fmt(-settle):'零'}
            </span>
          </div>
          ${over?`<div style="background:var(--orange-bg);color:var(--orange-text);padding:4px 8px;border-radius:4px;font-size:11px;"><i class="ti ti-alert-triangle"></i> 超過 110% 上限</div>`:''}
        </div>`;
      }
      document.getElementById('sel-validation').innerHTML = html;
    });
  });
}

async function submitSelection(ownerId, status) {
  const units  = document.getElementById('sel-units').value.split(',').map(s=>s.trim()).filter(Boolean);
  const parks  = document.getElementById('sel-parks').value.split(',').map(s=>s.trim()).filter(Boolean);
  const date   = document.getElementById('sel-date').value;
  const reason = document.getElementById('sel-reason').value;

  if (status === 'confirmed' && !reason) {
    alert('正式登錄需填寫修改原因');
    return;
  }

  try {
    await apiPost('saveSelection', {
      owner_id: ownerId, unit_nos: units, parking_nos: parks,
      status, form_date: date, change_reason: reason,
    });
    closeModal();
    await loadSelections();
    renderOwnerList();
    renderOwnerDetail(ownerId);
  } catch(e) { alert('儲存失敗：' + e.message); }
}

async function confirmSelection(ownerId) {
  const reason = prompt('請輸入正式登錄原因：');
  if (!reason) return;
  try {
    const sel = getSelForOwner(ownerId);
    const units = Array.isArray(sel.unit_nos) ? sel.unit_nos : JSON.parse(sel.unit_nos||'[]');
    const parks = Array.isArray(sel.parking_nos) ? sel.parking_nos : JSON.parse(sel.parking_nos||'[]');
    await apiPost('saveSelection', {
      owner_id: ownerId, unit_nos: units, parking_nos: parks,
      status: 'confirmed', form_date: sel.form_date, change_reason: reason,
    });
    await loadSelections();
    renderOwnerList();
    renderOwnerDetail(ownerId);
  } catch(e) { alert('失敗：' + e.message); }
}

async function submitOwner(ownerId) {
  const data = {
    serial_no:    document.getElementById('o-serial').value,
    name:         document.getElementById('o-name').value,
    phone:        document.getElementById('o-phone').value,
    address:      document.getElementById('o-address').value,

    handler:      document.getElementById('o-handler').value,
    participate:  document.getElementById('o-participate').value,
    has_agent:    document.getElementById('o-hasagent').value,
    agent_name:   document.getElementById('o-agentname').value,
  };
  const idVal = document.getElementById('o-id').value;
  if (idVal) data.id_number = idVal;
  if (ownerId) data.owner_id = ownerId;
  if (!data.name) { alert('姓名為必填'); return; }
  try {
    await apiPost('saveOwner', data);
    closeModal();
    await loadOwners();
    renderOwnerList();
  } catch(e) { alert('儲存失敗：' + e.message); }
}

function openCallModal(ownerId) {

    ${!owner ? `<div class="mb-12"><div class="field-label">地主</div>

    </div>` : ''}
    <div class="mb-16">
      <div class="field-label">選擇檔案（PDF 或照片）</div>
      <input type="file" id="u-file" accept=".pdf,.jpg,.jpeg,.png" style="background:none;border:none;padding:0;">
      <div class="text-xs text-muted mt-4">
        上傳後自動更名並歸檔至 Google Drive 對應資料夾，並標記為已收件。
      </div>
    </div>
    <div id="upload-status"></div>
    <div class="flex gap-8 justify-between">
      <button class="btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="submitUpload('${ownerId}')">上傳至 Google Drive</button>
    </div>

async function submitUpload(ownerId) {
  const owner  = STATE.owners.find(o => o.owner_id == ownerId);
  const file   = document.getElementById('u-file').files[0];
  const dtype  = document.getElementById('u-type').value;
  if (!file) { alert('請選擇檔案'); return; }

  const hasAgent = owner && (owner.has_agent === true || owner.has_agent === 'true');
  const needAgentName = ['代理人證件','授權書'].includes(dtype) && hasAgent;

  document.getElementById('upload-status').innerHTML = '<div class="text-sm text-muted">上傳中…</div>';

  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result.split(',')[1];
    try {
      const res = await apiPost('uploadDoc', {
        owner_id:    ownerId,
        owner_name:  owner?.name || '',
        doc_type:    dtype,
        agent_name:  needAgentName ? (owner?.agent_name || '') : '',
        file_base64: base64,
        file_name:   file.name,
        mime_type:   file.type,
      });
      document.getElementById('upload-status').innerHTML =
        `<div style="background:var(--green-bg);color:var(--green-text);padding:8px 10px;border-radius:var(--rm);font-size:12px;">
          ✓ 上傳成功：${res.file_name}
          <a href="${res.url}" target="_blank" style="color:var(--green-text);margin-left:6px;">開啟 →</a>
        </div>`;
      // 重新載入收件狀態
      await loadDocStatus();
      renderOwnerList();
      renderOwnerDetail(ownerId);
    } catch(ex) {
      document.getElementById('upload-status').innerHTML =
        `<div style="background:var(--red-bg);color:var(--red-text);padding:8px 10px;border-radius:var(--rm);font-size:12px;">上傳失敗：${ex.message}</div>`;
    }
  };
  reader.readAsDataURL(file);
}

// ============================================================
//  EXPORT
// ============================================================
async function doExport() {
  try {
    const data = await apiGet('export');
    const records = data.records || [];
    if (!records.length) { alert('無資料可匯出'); return; }

    // Build CSV
    const headers = Object.keys(records[0]);
    const csv = [
      headers.join(','),
      ...records.map(r => headers.map(h => `"${String(r[h]||'').replace(/"/g,'""')}"`).join(','))
    ].join('\n');

    const BOM = '\uFEFF';
    const blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `清水段_選屋登記總表_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  } catch(e) { alert('匯出失敗：' + e.message); }
}

  ['list','merge','lottery','calls','announce','settle','settings'].forEach(v => {

    if (el) el.style.display = v === view ? '' : 'none';

async function loadAnnounceList() {

  el.innerHTML = list.map(a => {
    const lv = ANN_LEVELS[a.level] || ANN_LEVELS.info;
    return `<div class="card mb-8" style="display:flex;align-items:flex-start;gap:12px;">
      <span style="font-size:11px;font-weight:600;color:${lv.color};background:${lv.bg};

async function submitAnnounce() {
  const title = document.getElementById('ann-title').value.trim();
  if (!title) { alert('標題為必填'); return; }
  try {
    await apiPost('addAnnouncement', {
      level:   document.getElementById('ann-level').value,
      title,
      content: document.getElementById('ann-content').value,
      date:    document.getElementById('ann-date').value,
    });
    closeModal();
    loadAnnounceList();
  } catch(e) { alert('發布失敗：' + e.message); }
}

async function deleteAnnounce(annId) {
  if (!confirm('確定刪除這則公告？')) return;
  try {
    await apiPost('deleteAnnouncement', { ann_id: annId });
    loadAnnounceList();
  } catch(e) { alert('刪除失敗：' + e.message); }
}
