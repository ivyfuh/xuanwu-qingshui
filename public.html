<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清水段都更 · 地主選屋資訊平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
:root{
  --cp:#fff;--cs:#f6f5f0;--ct:#eeede8;
  --tp:#1a1a18;--ts:#6b6a64;--tt:#9c9a92;
  --bt:rgba(0,0,0,.12);--bs:rgba(0,0,0,.28);
  --rm:8px;--rl:12px;
  /* 漢皇品牌色 */
  --brand:#748B97;--brand-dark:#5C7280;--brand-light:#E7ECEF;--brand-text:#3D4F58;
  --warm:#D8D3C9;--warm-bg:#F0EDE7;
  --green:#1D9E75;--green-bg:#E1F5EE;--green-text:#085041;
  --red:#E24B4A;--red-bg:#FCEBEB;--red-text:#791F1F;
  --orange:#EF9F27;--orange-bg:#FAEEDA;--orange-text:#633806;
}
@media(prefers-color-scheme:dark){
  :root{--cp:#1c1c1a;--cs:#242422;--ct:#2e2e2c;--tp:#e8e6de;--ts:#9c9a92;--tt:#6b6a64;
    --bt:rgba(255,255,255,.12);--bs:rgba(255,255,255,.28);
    --brand:#8DA3AE;--brand-light:#2A363C;--brand-text:#A9BCC5;}
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;
  background:var(--ct);font-size:13px;color:var(--tp);min-height:100vh;}
input,button,select{font-family:inherit;font-size:13px;color:var(--tp);outline:none;}
input{background:var(--cp);border:0.5px solid var(--bs);border-radius:var(--rm);padding:8px 12px;width:100%;}
input:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(29,158,117,.12);}
button{cursor:pointer;border-radius:var(--rm);padding:8px 16px;border:none;}
.container{max-width:900px;margin:0 auto;padding:0 16px;}

/* ── 科技感主題升級 ── */
body { background: var(--ct); }

/* 動態光暈效果 */
@keyframes pulse-glow {
  0%,100% { box-shadow: 0 0 0 0 rgba(116,139,151,0); }
  50%      { box-shadow: 0 0 12px 2px rgba(116,139,151,.18); }
}
@keyframes scan-line {
  0%   { transform: translateY(-100%); opacity: 0; }
  10%  { opacity: .4; }
  90%  { opacity: .4; }
  100% { transform: translateY(2000%); opacity: 0; }
}

/* Header 升級 */
.page-header {
  background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand) 60%, #8FAAB8 100%);
  border-bottom: none;
  padding: 20px 0;
  position: relative;
  overflow: hidden;
}
.page-header::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
  animation: scan-line 4s ease-in-out infinite;
}
.page-header .container { align-items: center; }

/* floor-cell 升級：科技感 */
.floor-cell {
  position: relative;
  transition: all .15s ease;
  font-size: 9px;
}
.floor-cell:hover {
  transform: scale(1.12) !important;
  z-index: 3;
}
.fc-empty {
  background: var(--cs);
  border-color: rgba(116,139,151,.2);
}
.fc-sel {
  background: linear-gradient(135deg, #d4f0e5, #a8e0cc);
  border-color: #7FD4B5;
  animation: pulse-glow 3s ease-in-out infinite;
}
.fc-dup {
  background: linear-gradient(135deg, #fce8e8, #f5c0c0);
  border-color: #e88585;
}

/* park-cell 升級 */
.park-cell { transition: all .15s ease; }
.pc-sel {
  background: linear-gradient(135deg, #d4f0e5, #a8e0cc);
  border-color: #7FD4B5;
}

/* verify-box 升級 */
.verify-box {
  background: linear-gradient(135deg, var(--cp) 80%, var(--brand-light));
  border: 0.5px solid var(--brand);
  border-radius: var(--rl);
  padding: 24px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.verify-box::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(116,139,151,.12) 0%, transparent 70%);
}

/* card 升級 */
.card {
  background: var(--cp);
  border: 0.5px solid var(--bt);
  border-radius: var(--rl);
  padding: 16px;
  transition: box-shadow .2s;
}
.card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.06); }

/* stat-card 升級 */
.stat-card {
  background: linear-gradient(135deg, var(--cp) 70%, var(--brand-light));
  position: relative;
  overflow: hidden;
}
.stat-card::after {
  content: '';
  position: absolute;
  bottom: 0; right: 0;
  width: 40px; height: 40px;
  background: radial-gradient(circle at bottom right, rgba(116,139,151,.1), transparent 70%);
}

/* unit panel 升級 */
#unit-panel {
  background: var(--cp);
  border-left: 2px solid var(--brand);
  box-shadow: -4px 0 20px rgba(0,0,0,.06);
}

/* timeline dot 動畫 */
.tl-dot-active { animation: pulse-glow 2s ease-in-out infinite; }

/* 格線標題 */
.grid-header {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--tt);
  padding: 10px 16px 6px;
  border-bottom: 0.5px solid var(--bt);
}

/* 空間標籤（互動平面圖用） */
.room-label {
  position: absolute;
  font-size: 9px;
  font-weight: 600;
  color: var(--brand-text);
  background: rgba(116,139,151,.12);
  border-radius: 3px;
  padding: 1px 4px;
  pointer-events: none;
  white-space: nowrap;
  letter-spacing: .03em;
}

/* 互動平面圖容器 */
.floor-plan-wrap {
  position: relative;
  background: var(--brand-light);
  border-radius: var(--rm);
  overflow: hidden;
  margin-bottom: 12px;
  min-height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.floor-plan-wrap svg { width: 100%; height: auto; display: block; }

/* 響應式 */
@media(max-width:600px) {
  .page-header { padding: 14px 0; }
  #unit-panel { display: none !important; }
}

/* (page-header style moved to upgrade section above) */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;
  padding:3px 8px;border-radius:10px;}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px;}
@media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--cp);border:0.5px solid var(--bt);border-radius:var(--rl);
  padding:12px 16px;text-align:center;}
.stat-n{font-size:22px;font-weight:500;margin-bottom:2px;}
.stat-l{font-size:11px;color:var(--tt);}

/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:7px 14px;border-radius:var(--rm);border:0.5px solid var(--bs);
  background:var(--cp);color:var(--ts);cursor:pointer;font-size:13px;}
.tab.active{background:var(--cs);color:var(--tp);font-weight:500;}

/* Floor grid */
.floor-cell{width:44px;height:30px;border-radius:3px;display:inline-flex;align-items:center;
  justify-content:center;font-size:9.5px;font-weight:600;cursor:pointer;
  border:0.5px solid var(--bt);margin:1px;transition:opacity .12s,transform .1s;}
.floor-cell:hover{opacity:.8;transform:scale(1.05);}
.fc-empty{background:var(--cs);}
.fc-sel{background:var(--green-bg);border-color:#9FE1CB;color:var(--green-text);}
.fc-dup{background:var(--red-bg);border-color:#F09595;color:var(--red-text);}

/* Parking cells — show number */
.park-cell{min-width:42px;height:30px;padding:0 4px;border-radius:4px;
  display:inline-flex;align-items:center;justify-content:center;gap:2px;
  font-size:11px;font-weight:600;cursor:pointer;border:0.5px solid var(--bt);
  transition:opacity .12s,transform .1s;position:relative;}
.park-cell:hover{opacity:.82;transform:scale(1.06);z-index:2;}
.pc-empty{background:var(--cs);color:var(--ts);font-weight:500;}
.pc-sel{background:var(--green-bg);border-color:#9FE1CB;color:var(--green-text);}
.pc-dup{background:var(--red-bg);border-color:#F09595;color:var(--red-text);}
.pc-badge{background:var(--red);color:#fff;font-size:8px;font-weight:700;
  border-radius:7px;padding:0 4px;line-height:1.4;}

/* Documents */
.doc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:24px;}
@media(max-width:500px){.doc-grid{grid-template-columns:1fr;}}
.doc-card{background:var(--cp);border:0.5px solid var(--bt);border-radius:var(--rm);
  padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;
  text-decoration:none;color:inherit;}
.doc-card:hover{background:var(--cs);}
.doc-icon{width:36px;height:36px;border-radius:var(--rm);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;font-size:18px;}

/* Timeline */
.timeline{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:24px;
  background:var(--cp);border:0.5px solid var(--bt);border-radius:var(--rl);padding:16px;}
.tl-step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:70px;}
.tl-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;}
.tl-line{flex:1;height:2px;min-width:16px;}
.tl-label{font-size:10px;text-align:center;line-height:1.3;}

/* Verify section */
.verify-box{background:var(--cp);border:0.5px solid var(--bt);border-radius:var(--rl);
  padding:20px;margin-bottom:24px;}
.result-card{background:var(--cp);border:1.5px solid #9FE1CB;border-radius:var(--rl);
  padding:16px;margin-top:12px;}

/* Unit detail panel */
#unit-panel{display:none;width:240px;border-left:0.5px solid var(--bt);
  background:var(--cp);overflow-y:auto;padding:14px;flex-shrink:0;}

/* Duplicate notice */
.dup-notice{background:var(--red-bg);border:0.5px solid #F09595;border-radius:var(--rl);
  padding:12px 16px;margin-bottom:16px;}

.card{background:var(--cp);border:0.5px solid var(--bt);border-radius:var(--rl);padding:16px;}
.field-label{font-size:11px;color:var(--tt);margin-bottom:4px;}
.text-muted{color:var(--tt);}
.text-sm{font-size:12px;}
.text-xs{font-size:11px;}
.font-medium{font-weight:500;}
.flex{display:flex;}.gap-6{gap:6px;}.gap-8{gap:8px;}
.items-center{align-items:center;}.justify-between{justify-content:space-between;}
.mb-8{margin-bottom:8px;}.mb-12{margin-bottom:12px;}.mb-16{margin-bottom:16px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
</style>
</head>

<div class="container">

  <!-- 公告欄（最上方顯眼處） -->
  <div id="announcement-area"></div>

  <!-- 倒數計時橫幅 -->
  <style>
    @keyframes cdPulse { 0%,100%{box-shadow:0 0 0 0 rgba(214,47,36,.55);} 50%{box-shadow:0 0 0 12px rgba(214,47,36,0);} }
    .cd-pulse { animation: cdPulse 1.4s ease-in-out infinite; }
    .cd-seg { background:rgba(255,255,255,.16);border-radius:10px;padding:7px 12px;min-width:54px;text-align:center; }
    .cd-seg .cd-num { font-size:30px;font-weight:700;color:#fff;line-height:1;font-variant-numeric:tabular-nums; }
    .cd-seg .cd-lab { font-size:10px;color:rgba(255,255,255,.8);margin-top:4px; }
  </style>
  <div id="countdown-banner" style="display:none;background:linear-gradient(135deg,var(--brand-dark),var(--brand));
    border-radius:var(--rl);padding:18px 24px;margin-bottom:16px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
    box-shadow:0 4px 16px rgba(0,0,0,.12);transition:background .6s;">
    <div style="flex:1;min-width:240px;">
      <div id="countdown-tagline" style="font-size:13px;font-weight:600;color:#fff;letter-spacing:.04em;margin-bottom:10px;">
        <i class="ti ti-alarm"></i> 選屋截止倒數
      </div>
      <div id="countdown-clock" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
    </div>
    <div style="text-align:right;min-width:150px;">
      <div style="font-size:11px;color:rgba(255,255,255,.75);">截止日期</div>
      <div style="font-size:16px;font-weight:600;color:#fff;" id="countdown-end-date">—</div>
      <div style="font-size:11px;color:rgba(255,255,255,.7);margin-top:4px;" id="countdown-detail"></div>
      <div style="margin-top:8px;width:160px;max-width:42vw;margin-left:auto;">
        <div style="height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;">
          <div id="countdown-progress" style="height:6px;width:0%;background:#fff;border-radius:3px;transition:width .6s;"></div>
        </div>
        <div id="countdown-progress-label" style="font-size:9px;color:rgba(255,255,255,.7);margin-top:3px;text-align:right;"></div>
      </div>
    </div>
  </div>

  <!-- Stats — 基本資訊 -->
  <div class="stats-row" style="grid-template-columns:repeat(2,1fr);">
    <div class="stat-card"><div class="stat-n" id="s-floors" style="color:var(--brand-text);">21F</div><div class="stat-l">最高樓層</div></div>
    <div class="stat-card"><div class="stat-n" id="s-basement" style="color:var(--brand-text);">B5</div><div class="stat-l">地下層數</div></div>
  </div>

  <!-- Timeline（五階段，由後台案件設定驅動） -->
  <div class="timeline" id="timeline"></div>


  <!-- Selection grid + panel -->
  <div class="card mb-16" style="padding:0;overflow:hidden;">
    <div style="padding:14px 16px;border-bottom:0.5px solid var(--bt);">
      <div class="flex items-center justify-between flex-wrap gap-8">
        <div style="font-size:14px;font-weight:500;"><i class="ti ti-building"></i> 即時選屋狀態</div>
        <div class="flex gap-8 text-xs" style="flex-wrap:wrap;">
          <span style="display:flex;align-items:center;gap:4px;">
            <span style="width:10px;height:10px;background:var(--green-bg);border:0.5px solid #9FE1CB;border-radius:2px;display:inline-block;"></span>已選配</span>
          <span style="display:flex;align-items:center;gap:4px;">
            <span style="width:10px;height:10px;background:var(--red-bg);border:0.5px solid #F09595;border-radius:2px;display:inline-block;"></span>重複待抽</span>
          <span style="display:flex;align-items:center;gap:4px;">
            <span style="width:10px;height:10px;background:var(--cs);border:0.5px solid var(--bt);border-radius:2px;display:inline-block;"></span>未選</span>
        </div>
      </div>
      <!-- Tower / parking tabs -->
      <div class="tabs" style="margin-top:10px;margin-bottom:0;">
        <button class="tab active" id="tower-a" onclick="showTower('A')">A棟</button>
        <button class="tab" id="tower-b" onclick="showTower('B')">B棟</button>
        <button class="tab" id="tower-pk" onclick="showTower('P')"><i class="ti ti-car"></i> 車位</button>
      </div>
    </div>

    <div style="display:flex;overflow:hidden;">
      <!-- Grid area -->
      <div style="flex:1;overflow:auto;padding:14px;">
        <div id="grid-area"></div>
        <div id="dup-notices"></div>
      </div>
      <!-- Unit detail panel -->
      <div id="unit-panel">
        <div id="unit-panel-inner"></div>
      </div>
    </div>
  </div>

  <!-- Identity verification -->
  <div class="verify-box">
    <div style="font-size:14px;font-weight:500;margin-bottom:4px;">
      <i class="ti ti-shield-lock"></i> 查詢我的選配結果
    </div>
    <div class="text-sm text-muted mb-12">輸入姓名與身分證字號，查看您的個人選配詳情</div>
    <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;">
      <div><div class="field-label">姓名</div><input type="text" id="v-name" placeholder="請輸入真實姓名"></div>
      <div><div class="field-label">身分證字號</div><input type="text" id="v-id" placeholder="A123456789" maxlength="10" style="letter-spacing:.05em;text-transform:uppercase;"></div>
      <div style="display:flex;align-items:flex-end;">
        <button onclick="doVerify()" style="height:38px;padding:0 18px;background:var(--brand);color:#fff;white-space:nowrap;font-size:13px;font-weight:500;">查詢</button>
      </div>
    </div>
    <div class="text-xs text-muted flex gap-4 items-center">
      <i class="ti ti-lock" style="font-size:12px;"></i> 資料加密傳輸，不留存查詢紀錄
    </div>
    <div id="verify-result"></div>
  </div>

<script>
// ============================================================
//  CONFIG
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbz2oTXAMAVHdMBmtk5y3wJQRQ03Rf5y6AbG5K79wRuIpQIihENevTDRADcTnc99CZ4MPg/exec';

// ============================================================
//  STATE
// ============================================================
let STATE = {
  unitStatus: {}, parkStatus: {},
  unitMap: {}, parkMap: {},
  tower: 'A',
  cfg: {}
};

// ============================================================
//  INIT
// ============================================================
window.onload = async function() {
  await loadConfig();
  renderTimeline();   // 確保即使 getCase 失敗也以預設五階段顯示
  await Promise.all([loadStatus(), loadUnitData(), loadParkingData()]);
  renderGrid();
  renderStats();
  document.getElementById('update-time').textContent = '更新：' + new Date().toLocaleString('zh-TW');
};

// 「重新載入」按鈕：原地重新抓最新資料（給不熟悉瀏覽器重整的長輩）
async function reloadPublic() {
  const btn = document.getElementById('reload-btn');
  const old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader"></i> 更新中…'; }
  try {
    await loadConfig();
    renderTimeline();
    await Promise.all([loadStatus(), loadUnitData(), loadParkingData()]);
    renderGrid();
    renderStats();
    document.getElementById('update-time').textContent = '更新：' + new Date().toLocaleString('zh-TW');
    // 清除已輸入的查詢資料 + 查詢結果，回到起始頁面
    const vn = document.getElementById('v-name'); if (vn) vn.value = '';
    const vi = document.getElementById('v-id');   if (vi) vi.value = '';
    const vr = document.getElementById('verify-result'); if (vr) vr.innerHTML = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    location.reload();   // 萬一原地更新失敗，退回整頁重載
    return;
  }
  if (btn) { btn.disabled = false; btn.innerHTML = old; }
}

async function apiGet(action, params={}, retries=2) {
  const qs = new URLSearchParams({ action, ...params });
  for (let attempt = 0; ; attempt++) {
    try {
      const res = await fetch(`${API_URL}?${qs}`);
      const d   = await res.json();
      return d.status === 'ok' ? d.data : null;
    } catch (e) {
      if (attempt >= retries) throw e;
      await new Promise(r => setTimeout(r, 600 * (attempt + 1)));  // 失敗稍等再試
    }
  }
}

// 倒數結束日：優先用 _config.selection_end；沒填就抓「選屋期間」階段的結束日（支援西元/民國、日期範圍）
function deriveSelectionEnd(cfg) {
  if (cfg.selection_end) return cfg.selection_end;
  const stages = Array.isArray(cfg.stages) ? cfg.stages : [];
  const stage = stages.find(s => String(s.name||'').includes('選屋'));
  if (!stage || !stage.date) return '';
  const parts = String(stage.date).split(/[-~–—至]/).map(s => s.trim()).filter(Boolean);
  let endStr = parts.length > 1 ? parts[parts.length - 1] : parts[0];
  // 結束端若省略年份（如 07/31）→ 補開始端的年份
  if (parts.length > 1 && !/\d{3,4}[\/\-]/.test(endStr)) {
    const y = parts[0].match(/^(\d{3,4})[\/\-]/);
    if (y) endStr = y[1] + '/' + endStr;
  }
  const m = endStr.match(/^(\d{3,4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if (!m) return '';
  let yr = parseInt(m[1], 10);
  if (yr < 1911) yr += 1911;   // 民國 → 西元
  return `${yr}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
}

// 選屋期間起始日（給進度條算「已過幾%」）
function deriveSelectionStart(cfg) {
  if (cfg.selection_start) return cfg.selection_start;
  const stages = Array.isArray(cfg.stages) ? cfg.stages : [];
  const stage = stages.find(s => String(s.name||'').includes('選屋'));
  if (!stage || !stage.date) return '';
  const startStr = String(stage.date).split(/[-~–—至]/).map(s => s.trim()).filter(Boolean)[0] || '';
  const m = startStr.match(/^(\d{3,4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if (!m) return '';
  let yr = parseInt(m[1], 10);
  if (yr < 1911) yr += 1911;
  return `${yr}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
}

// 即時倒數（天/時/分/秒每秒跳動 + 顏色分級 + 文案升級 + 已過進度條）
let _cdTimer = null;
function startCountdown(endDate, startDate) {
  const banner = document.getElementById('countdown-banner');
  const end = new Date(endDate + 'T23:59:59').getTime();   // 截止日當天 23:59:59 為止
  if (!banner || isNaN(end)) return;
  const start = startDate ? new Date(startDate + 'T00:00:00').getTime() : null;
  banner.style.display = 'flex';
  document.getElementById('countdown-end-date').textContent =
    new Date(end).toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric' });

  if (_cdTimer) clearInterval(_cdTimer);
  const seg = (n, lab) => `<div class="cd-seg"><div class="cd-num">${String(n).padStart(2,'0')}</div><div class="cd-lab">${lab}</div></div>`;

  const tick = () => {
    const now = Date.now();
    let diff = end - now;
    const ended = diff <= 0;
    if (ended) diff = 0;
    const d = Math.floor(diff / 86400000);
    const h = Math.floor(diff % 86400000 / 3600000);
    const mi = Math.floor(diff % 3600000 / 60000);
    const s = Math.floor(diff % 60000 / 1000);

    const clk = document.getElementById('countdown-clock');
    if (clk) clk.innerHTML = ended
      ? '<div style="font-size:24px;font-weight:700;color:#fff;">選屋期間已截止</div>'
      : seg(d,'天') + seg(h,'時') + seg(mi,'分') + seg(s,'秒');

    // 顏色 / 文案 / 脈動 分級
    let bg, tag, pulse = false;
    if (ended)      { bg = 'linear-gradient(135deg,#5a6b73,#475560)'; tag = '<i class="ti ti-flag"></i> 選屋期間已截止'; }
    else if (d > 14){ bg = 'linear-gradient(135deg,var(--brand-dark),var(--brand))'; tag = '<i class="ti ti-alarm"></i> 選屋截止倒數'; }
    else if (d > 7) { bg = 'linear-gradient(135deg,#b9791f,#d99a32)'; tag = '<i class="ti ti-alarm"></i> 選屋期間倒數，請及早完成選屋'; }
    else if (d > 3) { bg = 'linear-gradient(135deg,#b23b2e,#d6533f)'; tag = '<i class="ti ti-alert-triangle"></i> 把握時間，盡快完成選屋'; }
    else            { bg = 'linear-gradient(135deg,#a62019,#d12f24)'; tag = `<i class="ti ti-alert-triangle"></i> 僅剩最後 ${d === 0 ? '不到一天' : d + ' 天'}，請盡速完成選屋！`; pulse = true; }
    banner.style.background = bg;
    banner.classList.toggle('cd-pulse', pulse);
    const tl = document.getElementById('countdown-tagline'); if (tl) tl.innerHTML = tag;
    const det = document.getElementById('countdown-detail');
    if (det) det.textContent = ended ? '' : `截止前還有 ${d} 天 ${h} 小時`;
    const cb = document.getElementById('countdown-badge');
    if (cb) cb.innerHTML = ended ? '<i class="ti ti-calendar"></i> 選屋已截止' : `<i class="ti ti-calendar"></i> 截止倒數 ${d} 天`;

    // 進度條：選屋期間已過 %
    if (start && end > start) {
      const pct = Math.min(100, Math.max(0, Math.round((now - start) / (end - start) * 100)));
      const pbar = document.getElementById('countdown-progress'); if (pbar) pbar.style.width = pct + '%';
      const plab = document.getElementById('countdown-progress-label'); if (plab) plab.textContent = `選屋期間已過 ${pct}%`;
    }
  };
  tick();
  _cdTimer = setInterval(tick, 1000);
}

async function loadConfig() {
  const cfg = await apiGet('getCase');
  if (!cfg) return;
  STATE.cfg = cfg;
  const isTest = cfg.env === 'test';
  document.getElementById('test-banner').style.display = isTest ? '' : 'none';
  // Countdown（沒填 selection_end 就自動用「選屋期間」階段結束日）
  let endDate = deriveSelectionEnd(cfg);
  // 預覽用：網址加 ?cd=5 → 假裝剩 5 天（看顏色分級用，不影響真實資料）
  const _cdTest = new URLSearchParams(location.search).get('cd');
  if (_cdTest !== null && !isNaN(parseInt(_cdTest, 10))) {
    endDate = new Date(Date.now() + parseInt(_cdTest, 10) * 86400000).toISOString().slice(0, 10);
  }
  if (endDate) {
    const sb = document.getElementById('status-badge');
    if (sb) { sb.innerHTML = '<i class="ti ti-pencil"></i> 選屋進行中'; sb.style.background = 'rgba(255,255,255,.22)'; sb.style.color = '#fff'; }
    startCountdown(endDate, deriveSelectionStart(cfg));
  } else {
    // #28 未設定截止日 → 顯示「籌備中」，不要整塊消失
    if (_cdTimer) { clearInterval(_cdTimer); _cdTimer = null; }
    const banner = document.getElementById('countdown-banner');
    if (banner) {
      banner.style.display = 'flex';
      banner.classList.remove('cd-pulse');
      banner.style.background = 'linear-gradient(135deg,var(--brand-dark),var(--brand))';
      const tl = document.getElementById('countdown-tagline'); if (tl) tl.innerHTML = '<i class="ti ti-clock"></i> 選屋截止倒數';
      const clk = document.getElementById('countdown-clock'); if (clk) clk.innerHTML = '<div style="font-size:22px;font-weight:700;color:#fff;">選屋期間籌備中</div>';
      document.getElementById('countdown-end-date').textContent = '日期近期公布';
      document.getElementById('countdown-detail').textContent = '';
      const pb = document.getElementById('countdown-progress'); if (pb) pb.style.width = '0%';
      const pl = document.getElementById('countdown-progress-label'); if (pl) pl.textContent = '';
    }
    const sb = document.getElementById('status-badge');
    if (sb) sb.innerHTML = '<i class="ti ti-clock"></i> 選屋籌備中';
  }
  renderTimeline();
  // 多則公告
  loadAnnouncements();
}

const DEFAULT_STAGES = [
  { name:'說明會',      date:'', status:'upcoming' },
  { name:'自辦公聽會',  date:'', status:'upcoming' },
  { name:'選屋期間',    date:'115/07/01-115/07/31', status:'upcoming' },

function renderTimeline() {
  const el = document.getElementById('timeline');
  if (!el) return;
  const stages = (STATE.cfg && Array.isArray(STATE.cfg.stages) && STATE.cfg.stages.length)
    ? STATE.cfg.stages : DEFAULT_STAGES;

  // 狀態樣式：已完成 / 已開始(進行中) / 即將開始
  const META = {
    done:     { dotBg:'var(--green-bg)', dotBorder:'var(--green)', icon:'ti-check',  iconColor:'var(--green)', labelColor:'var(--green-text)', tag:'已完成',   tagColor:'var(--green-text)' },
    active:   { dotBg:'#E8EDF0',         dotBorder:'#748B97',      icon:'ti-pencil', iconColor:'#748B97',      labelColor:'#3D4D56',           tag:'已開始',   tagColor:'var(--orange-text)' },
    upcoming: { dotBg:'var(--cs)',       dotBorder:'var(--bs)',    icon:'ti-clock',  iconColor:'var(--tt)',    labelColor:'var(--tt)',         tag:'即將開始', tagColor:'var(--tt)' },
  };

  let html = '';
  stages.forEach((s, i) => {
    const m = META[s.status] || META.upcoming;
    if (i > 0) {
      const prevDone = stages[i-1].status === 'done' || stages[i-1].status === 'active';
      html += `<div class="tl-line" style="background:${prevDone ? 'var(--green)' : 'var(--bt)'};"></div>`;
    }
    html += `<div class="tl-step">
      <div class="tl-dot ${s.status==='active'?'tl-dot-active':''}" style="background:${m.dotBg};border:2px solid ${m.dotBorder};">
        <i class="ti ${m.icon}" style="font-size:12px;color:${m.iconColor};"></i>
      </div>
      <div class="tl-label" style="color:${m.labelColor};font-weight:500;">
        ${s.name}
        ${s.date ? `<br><span style="font-size:9px;color:var(--tt);font-weight:400;">${s.date}</span>` : ''}
        <br><span style="font-size:9px;color:${m.tagColor};">${m.tag}</span>
      </div>
    </div>`;
  });
  el.innerHTML = html;
}

const FLOORS  = ['21F','20F','19F','18F','17F','16F','15F','14F','13F','12F','11F','10F',
                 '9F','8F','7F','6F','5F','4F','3F','2F'];

const A_TYPES = ['A1','A2','A3','A5','A6','A7','A8','A9'];
const B_TYPES = ['B1','B2','B3','B5','B6','B7','B8','B9'];
const PK_FLOORS = ['B1','B2','B3','B4','B5'];

function showTower(t) {
  STATE.tower = t;
  ['A','B','P'].forEach(x => {
    const el = document.getElementById('tower-' + (x === 'P' ? 'pk' : x.toLowerCase()));

function renderGrid() {
  const area = document.getElementById('grid-area');
  if (STATE.tower === 'P') { renderParkingGrid(area); return; }

  const types  = STATE.tower === 'A' ? A_TYPES : B_TYPES;
  const floors = [...FLOORS];

  let html = '';

  // Header row (unit types)
  html += `<div style="display:flex;gap:1px;padding-left:36px;margin-bottom:4px;">`;
  types.forEach(t => { html += `<div style="width:44px;font-size:9.5px;text-align:center;color:var(--tt);font-weight:500;">${t}</div>`; });
  html += `</div>`;

  floors.forEach(fl => {
    html += `<div style="display:flex;align-items:center;gap:1px;margin-bottom:2px;">`;
    html += `<div style="width:34px;font-size:10px;color:var(--tt);text-align:right;padding-right:4px;">${fl}</div>`;
    types.forEach(t => {
      const key = `${fl}-${t}`;
      const cnt = STATE.unitStatus[key] || 0;
      if (cnt === 0) {
        html += `<div class="floor-cell fc-empty" title="${key}：尚未選配" onclick="showUnit('${key}')"></div>`;
      } else if (cnt === 1) {
        html += `<div class="floor-cell fc-sel" title="${key}：已選配" onclick="showUnit('${key}')">
          <i class="ti ti-check" style="font-size:11px;"></i></div>`;
      } else {
        html += `<div class="floor-cell fc-dup" title="${key}：重複 ${cnt} 人" onclick="showUnit('${key}')">${cnt}人</div>`;
      }
    });
    html += `</div>`;
  });

  // 一樓店面 S1~S9（無 S4）：只在 A 棟顯示，排在 2F 下方（動態抓所有 1F-S*）
  if (STATE.tower === 'A') {
    const shopUnits = Object.keys(STATE.unitMap || {})
      .filter(k => /^1F-S/i.test(k))
      .sort((a, b) => (parseInt(a.replace(/\D/g, '')) || 0) - (parseInt(b.replace(/\D/g, '')) || 0));
    if (shopUnits.length) {
      html += `<div style="height:6px;"></div>`;
      // 店面代號表頭
      html += `<div style="display:flex;gap:1px;padding-left:36px;margin-bottom:4px;">`;
      shopUnits.forEach(key => { html += `<div style="width:44px;font-size:9.5px;text-align:center;color:var(--tt);font-weight:500;">${key.replace('1F-', '')}</div>`; });
      html += `</div>`;
      // 店面列
      html += `<div style="display:flex;align-items:center;gap:1px;margin-bottom:2px;">`;
      html += `<div style="width:34px;font-size:10px;color:var(--tt);text-align:right;padding-right:4px;">1F</div>`;
      shopUnits.forEach(key => {
        const cnt = STATE.unitStatus[key] || 0;
        if (cnt === 0) {
          html += `<div class="floor-cell fc-empty" title="${key}：尚未選配" onclick="showUnit('${key}')"></div>`;
        } else if (cnt === 1) {
          html += `<div class="floor-cell fc-sel" title="${key}：已選配" onclick="showUnit('${key}')"><i class="ti ti-check" style="font-size:11px;"></i></div>`;
        } else {
          html += `<div class="floor-cell fc-dup" title="${key}：重複 ${cnt} 人" onclick="showUnit('${key}')">${cnt}人</div>`;
        }
      });
      html += `</div>`;
      html += `<div style="padding-left:36px;font-size:9px;color:var(--tt);margin-top:2px;">↑ 一樓店面</div>`;
    }
  }

  area.innerHTML = html;
  renderDupNotices('unit');
}

function renderParkingGrid(area) {
  let html = '';
  PK_FLOORS.forEach(fl => {
    const spaces = Object.keys(STATE.parkMap)
      .filter(k => k.startsWith(fl + '-'))
      .sort((a, b) => {
        const na = parseInt(a.split('-')[1], 10);
        const nb = parseInt(b.split('-')[1], 10);
        return na - nb;
      });
    if (!spaces.length) return;
    html += `<div style="margin-bottom:14px;">`;
    html += `<div style="font-size:11px;font-weight:500;color:var(--tp);margin-bottom:6px;">
      ${fl} 地下層 (${spaces.length} 位)</div>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:3px;">`;
    spaces.forEach(pk => {
      const num = pk.split('-')[1];   // 顯示編號數字
      const cnt = STATE.parkStatus[pk] || 0;
      if (cnt === 0) {
        html += `<div class="park-cell pc-empty" title="${pk}：尚未選配" onclick="showParking('${pk}')">${num}</div>`;
      } else if (cnt === 1) {
        html += `<div class="park-cell pc-sel" title="${pk}：已選配" onclick="showParking('${pk}')">${num}</div>`;
      } else {
        html += `<div class="park-cell pc-dup" title="${pk}：重複 ${cnt} 人" onclick="showParking('${pk}')">${num}<span class="pc-badge">${cnt}</span></div>`;
      }
    });
    html += `</div></div>`;
  });
  area.innerHTML = html;
  renderDupNotices('parking');
}

function renderDupNotices(type) {
  const status = type === 'unit' ? STATE.unitStatus : STATE.parkStatus;
  const dups = Object.entries(status).filter(([,v]) => v >= 2).map(([k,v]) =>
    `<div class="text-sm" style="color:var(--red-text);">${k}：共 ${v} 人選配，待抽籤決定</div>`
  ).join('');

  if (dups) {
    document.getElementById('dup-notices').innerHTML = `
      <div class="dup-notice mt-12">
        <div class="font-medium text-sm" style="color:var(--red-text);margin-bottom:6px;">
          <i class="ti ti-alert-circle"></i> 重複選配公告
        </div>
        ${dups}
      </div>`;
  } else {
    document.getElementById('dup-notices').innerHTML = '';
  }
}

async function doVerify() {
  const name = document.getElementById('v-name').value.trim();
  const id   = document.getElementById('v-id').value.trim().toUpperCase();
  const el   = document.getElementById('verify-result');

  if (!name || !id) {
    el.innerHTML = `<div style="background:var(--red-bg);color:var(--red-text);padding:8px 12px;border-radius:var(--rm);font-size:12px;margin-top:8px;">請填寫姓名與身分證字號</div>`;
    return;
  }
  el.innerHTML = `<div class="text-sm text-muted" style="margin-top:8px;">查詢中…</div>`;

  try {
    const res = await apiGet('verifyOwner', { name, id });
    if (!res) throw new Error('API error');

    if (!res.matched) {
      el.innerHTML = `<div style="background:var(--red-bg);border:0.5px solid #F09595;border-radius:var(--rm);padding:10px 12px;font-size:12px;color:var(--red-text);margin-top:8px;">
        <i class="ti ti-alert-circle"></i> 找不到符合的地主資料，請確認後重試或聯絡漢皇建設
      </div>`;
      return;
    }

    if (res.no_selection) {
      el.innerHTML = `<div style="background:var(--cs);border:0.5px solid var(--bt);border-radius:var(--rm);padding:12px 14px;font-size:13px;color:var(--ts);margin-top:8px;">

      return;
    }

    const sel    = res.selection;
    const settle = sel ? Number(sel.settlement) : 0;
    const units  = sel ? (Array.isArray(sel.unit_nos) ? sel.unit_nos : JSON.parse(sel.unit_nos||'[]')) : [];
    const parks  = sel ? (Array.isArray(sel.parking_nos) ? sel.parking_nos : JSON.parse(sel.parking_nos||'[]')) : [];
    const status = sel?.status || 'none';
    const stLabel = { confirmed:'正式', draft:'草稿', needs_reselect:'需改選', none:'未登記' };
    const dupU = res.dup_units || [];
    const dupP = res.dup_parks || [];
    const hasDup = dupU.length || dupP.length;
    const merges = res.merge || [];
    const hasMerge = merges.length > 0;
    const mergeValue = merges.reduce((s, g) => s + (Number(g.value) || 0), 0);

    el.innerHTML = `<div style="background:var(--cp);border:1.5px solid #9FE1CB;border-radius:var(--rl);padding:16px;margin-top:10px;">
      <div class="flex items-center gap-8 mb-12">
        <div style="width:40px;height:40px;border-radius:50%;background:var(--green-bg);
          display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i class="ti ti-user" style="font-size:20px;color:var(--green-text);"></i>
        </div>
        <div><div style="font-size:15px;font-weight:500;">${res.name} 您好</div>
        <div class="text-xs text-muted">負責同仁：${res.handler||'—'}</div></div>
        <span style="margin-left:auto;background:${status==='confirmed'?'var(--green-bg)':'#E6F1FB'};
          color:${status==='confirmed'?'var(--green-text)':'#0C447C'};font-size:11px;
          font-weight:500;padding:2px 8px;border-radius:8px;">${stLabel[status]||status}</span>
      </div>
      <div class="grid-2 mb-12">
        <div style="background:var(--cs);border-radius:var(--rm);padding:10px 12px;">
          <div class="text-xs text-muted mb-4">選配上限</div>
          <div style="font-size:14px;font-weight:500;">NT$${fmt(res.upper_limit)}</div>
        </div>
        ${(!sel && hasMerge)
          ? `<div style="background:var(--cs);border-radius:var(--rm);padding:10px 12px;">
               <div class="text-xs text-muted mb-4">合併分配價值</div>
               <div style="font-size:14px;font-weight:500;">NT$${fmt(mergeValue)}</div>
             </div>`
          : `<div style="background:${settle>0?'var(--red-bg)':settle<0?'var(--green-bg)':'var(--cs)'};border-radius:var(--rm);padding:10px 12px;">
               <div class="text-xs mb-4" style="color:${settle>0?'var(--red-text)':settle<0?'var(--green-text)':'var(--tt)'};">找補試算</div>
               <div style="font-size:14px;font-weight:500;color:${settle>0?'var(--red-text)':settle<0?'var(--green-text)':'var(--tt)'};">
                 ${settle>0?'需補差 NT$'+fmt(settle):settle<0?'退款 NT$'+fmt(-settle):'無需找補'}
               </div>
             </div>`}
      </div>
      ${units.length||parks.length ? `<div class="text-xs text-muted mb-4">已登記選配</div>
        ${units.map(u=>{const d=dupU.indexOf(u)>=0;return `<div class="text-sm" style="padding:4px 0;border-bottom:0.5px solid var(--bt);${d?'color:var(--red-text);font-weight:500;':''}">🏠 ${u}${d?' ⚠ 與他人重複，需抽籤':''}</div>`;}).join('')}
        ${parks.map(p=>{const d=dupP.indexOf(p)>=0;return `<div class="text-sm" style="padding:4px 0;border-bottom:0.5px solid var(--bt);${d?'color:var(--red-text);font-weight:500;':''}">🚗 ${p}${d?' ⚠ 與他人重複，需抽籤':''}</div>`;}).join('')}` : ''}
      ${hasMerge ? `<div class="text-xs text-muted mb-4" style="margin-top:12px;">合併選配</div>
        ${merges.map(g => `<div style="background:var(--cs);border-radius:var(--rm);padding:8px 12px;margin-bottom:6px;">
          <div class="text-xs text-muted mb-4">與其他 ${Math.max(0,(g.member_count||1)-1)} 人合併・您的持分 ${g.num}/${g.den}・本組分配價值 NT$${fmt(g.value)}</div>
          ${(g.units||[]).map(u=>`<div class="text-sm" style="padding:3px 0;">🏠 ${u}</div>`).join('')}
          ${(g.parks||[]).map(p=>`<div class="text-sm" style="padding:3px 0;">🚗 ${p}</div>`).join('')}
        </div>`).join('')}` : ''}
      ${hasDup ? `<div style="background:var(--red-bg);color:var(--red-text);padding:8px 10px;border-radius:var(--rm);font-size:12px;margin-top:10px;">
        <i class="ti ti-alert-circle"></i> 您選的${dupU.length?` ${dupU.join('、')}（戶別）`:''}${dupP.length?` ${dupP.join('、')}（車位）`:''} 與其他地主重複，將以公開抽籤決定最終分配，請持續關注公告。</div>` : ''}
      ${status === 'none' && !hasMerge ? `<div style="background:var(--orange-bg);color:var(--orange-text);padding:8px 10px;border-radius:var(--rm);font-size:12px;margin-top:10px;">
        您尚未完成選配，請聯絡漢皇建設辦理選配作業。</div>` : ''}
      ${status === 'needs_reselect' ? `<div style="background:#E8EDF0;color:#3D4D56;padding:8px 10px;border-radius:var(--rm);font-size:12px;margin-top:10px;">
        您的選配因重複抽籤結果須重新選配，請盡速與負責同仁聯絡。</div>` : ''}
    </div>`;
  } catch(e) {
    el.innerHTML = `<div style="background:var(--red-bg);color:var(--red-text);padding:8px 12px;border-radius:var(--rm);font-size:12px;margin-top:8px;">查詢失敗，請稍後再試</div>`;
  }
}

// ============================================================
//  UTILS
// ============================================================
function fmt(n) { return Math.round(n||0).toLocaleString('zh-TW'); }
</script>
</body>
</html>
