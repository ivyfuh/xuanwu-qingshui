<style>

  .cb{width:22px;height:22px;flex:0 0 22px;margin-top:2px;cursor:pointer;accent-color:#0F6E56;}
  .txt{flex:1;}
  .t{font-size:14.5px;font-weight:500;}
  .e{font-size:12.5px;color:#0F6E56;margin-top:1px;}

  .note input::placeholder{color:#b3bbc0;}
  .note input.has{border-color:#E24B4A;background:#FFF7F7;}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dde1e4;padding:9px 16px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
  .bar .gp{font-size:13px;color:#3D4F58;}
  .bar .sync{font-size:11.5px;color:#9aa3a8;}
  .bar button{border:1px solid #5C7280;background:#5C7280;color:#fff;border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;}
  .bar button.ghost{background:#fff;color:#5C7280;}
  .hide{display:none;}
  .launch-row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0;}
  .launch-row a{display:inline-flex;align-items:center;gap:6px;background:#0F6E56;color:#fff;text-decoration:none;border-radius:8px;padding:11px 20px;font-size:15px;font-weight:600;}
  .launch-row a.alt{background:#3A6EA5;}
  .launch{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);color:#3D4F58;text-decoration:none;border-radius:14px;padding:3px 11px;font-size:12px;font-weight:600;}
  .launch:hover{background:#fff;}
  textarea#out{position:fixed;left:-9999px;}
  .toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:#2c333a;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>

<div class="sub">2026/06/29　·　大家的勾選與備註會即時同步，子瑄後台也看得到（每15秒自動刷新）</div>

<div class="pre">

<div id="plan"></div>

    <button class="ghost" onclick="refreshNow()">立即刷新</button>

const API_URL = 'https://script.google.com/macros/s/AKfycbz2oTXAMAVHdMBmtk5y3wJQRQ03Rf5y6AbG5K79wRuIpQIihENevTDRADcTnc99CZ4MPg/exec';
async function apiGet(action){
  const res = await fetch(`${API_URL}?action=${action}`);
  const d = await res.json();
  return d.status === 'ok' ? d.data : null;
}
async function apiPost(action, body){
  const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action, ...body }) });
  const d = await res.json();
  if (d.status !== 'ok') throw new Error('API error');
  return d.data;
}

let state = {};                       // { id: {c, n, who, at} }
let me = localStorage.getItem('qs-test-me') || '';
let meName = (PLAN.find(p=>p.key===me)||{}).name || '';
let editingId = null;                 // 正在打字的備註，刷新時不蓋它
const noteTimers = {};

function st(id){ return state[id] || (state[id] = {c:false, n:'', who:'', at:''}); }
function nameOf(){ return meName || '訪客'; }
function hhmm(iso){ return iso ? String(iso).slice(11,16) : ''; }

function render(){
  document.getElementById('launch-row').innerHTML =
    `<a href="${ADMIN}" target="_blank">▶ 後台管理系統</a>` +
    `<a class="alt" href="${PUBLIC}" target="_blank">▶ 公開頁（地主端）</a>`;
  document.getElementById('who').innerHTML =
    '<span style="font-size:13px;color:#7a848c;">我是：</span>' +
    PLAN.map(p => `<button class="${me===p.key?'active':''}" onclick="setMe('${p.key}')">${p.name}</button>`).join('') +
    `<button class="${me===''?'active':''}" onclick="setMe('')">全部顯示</button>`;

  document.getElementById('plan').innerHTML = PLAN.map(p => {
    const show = (me==='' || me===p.key);
    const isPub = p.key==='r2jy';
    let launch = `<a class="launch" href="${isPub?PUBLIC:ADMIN}" target="_blank" onclick="event.stopPropagation()">▶ ${isPub?'公開頁':'後台'}</a>`;
    if(isPub) launch += `<a class="launch" href="${PUBLIC}?cd=5" target="_blank" onclick="event.stopPropagation()">剩5天</a><a class="launch" href="${PUBLIC}?cd=2" target="_blank" onclick="event.stopPropagation()">剩2天</a>`;
    const rows = p.items.map((it,i)=>{
      const id = p.key+'-'+i; const s = st(id);
      return `<div class="item ${s.c?'done':''}" data-item="${id}">
        <div class="row">
          <input type="checkbox" class="cb" data-cb="${id}" ${s.c?'checked':''} onchange="toggle('${id}',this.checked)">
          <div class="txt">
            <div class="t">${it.t}</div>
            <div class="e">預期：${it.e}</div>
            <div class="by" data-by="${id}">${s.who?('✓ '+s.who+(s.at?' · '+hhmm(s.at):'')):''}</div>
          </div>
        </div>
        <div class="note"><input type="text" data-note="${id}" placeholder="有問題寫這裡（即時同步）"
          value="${(s.n||'').replace(/"/g,'&quot;')}" class="${s.n?'has':''}"
          onfocus="editingId='${id}'" onblur="editingId=null"
          oninput="onNote('${id}',this.value,this)"></div>
      </div>`;
    }).join('');
    return `<div class="sec ${show?'':'hide'}" data-k="${p.key}">
      <div class="sec-h" onclick="jump('${p.key}')">
        <div><span class="nm">${p.name}</span><span class="ar">${p.area}</span></div>
        <div style="display:flex;gap:6px;align-items:center;">${launch}<span class="pg" data-pg="${p.key}">0 / ${p.items.length}</span></div>
      </div>
      <div class="sec-b">${rows}</div>
    </div>`;
  }).join('');
  refreshDom();
}

function refreshDom(){
  PLAN.forEach(p=>{
    p.items.forEach((_,i)=>{
      const id=p.key+'-'+i; const s=st(id);
      const cb=document.querySelector(`[data-cb="${id}"]`); if(cb) cb.checked=s.c;
      const item=document.querySelector(`[data-item="${id}"]`); if(item) item.className='item'+(s.c?' done':'');
      const ni=document.querySelector(`[data-note="${id}"]`);
      if(ni && editingId!==id){ ni.value=s.n||''; ni.className=s.n?'has':''; }
      const by=document.querySelector(`[data-by="${id}"]`);
      if(by) by.innerHTML = s.who ? ('✓ '+s.who+(s.at?' · '+hhmm(s.at):'')) : '';
    });
    const done=p.items.filter((_,i)=>st(p.key+'-'+i).c).length;
    const pg=document.querySelector(`[data-pg="${p.key}"]`); if(pg) pg.textContent=done+' / '+p.items.length;
  });
  let done=0,total=0;
  PLAN.forEach(p=>p.items.forEach((_,i)=>{ total++; if(st(p.key+'-'+i).c)done++; }));
  document.getElementById('gp').textContent = `整體進度 ${done} / ${total}`;
}

function setMe(k){ me=k; meName=(PLAN.find(p=>p.key===k)||{}).name||''; localStorage.setItem('qs-test-me',k); render(); }
function jump(k){ if(me!==''&&me!==k) setMe(k); }

async function push(id){
  const s=st(id);
  try{ await apiPost('saveTestResult', { item_id:id, checked:s.c, note:s.n, who:s.who }); sync('已同步 '+hhmm(new Date().toISOString())); }
  catch(e){ sync('同步失敗，稍後自動重試'); }
}
function toggle(id,v){ const s=st(id); s.c=v; s.who=nameOf(); s.at=new Date().toISOString(); refreshDom(); push(id); }
function onNote(id,v,el){
  const s=st(id); s.n=v; s.who=nameOf(); s.at=new Date().toISOString(); el.className=v?'has':'';
  clearTimeout(noteTimers[id]); noteTimers[id]=setTimeout(()=>push(id), 700);   // 打字停 0.7 秒才送
}

async function pull(){
  try{
    const data = await apiGet('getTestResults');
    if(data){ Object.keys(data).forEach(id=>{ if(id!==editingId) state[id]=data[id]; }); refreshDom(); sync('已更新 '+hhmm(new Date().toISOString())); }
  }catch(e){ sync('離線中…'); }
}
function refreshNow(){ pull(); }
function sync(m){ document.getElementById('sync').textContent=m; }

function report(keys){
  let out = '【清水段選屋系統 測試回報】\n';
  PLAN.filter(p=>keys.includes(p.key)).forEach(p=>{
    out += `\n■ ${p.name}（${p.area}）\n`;
    p.items.forEach((it,i)=>{
      const s=st(p.key+'-'+i);
      out += `${s.c?'[V]':'[ ]'} ${it.t}`;
      if(s.n) out += `　→ 問題：${s.n}`;
      out += '\n';
    });
  });
  return out;
}
function doCopy(text){
  const ta=document.getElementById('out'); ta.value=text; ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  if(navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{});
  toast('已複製，可貼到群組 / 傳給子瑄');
}
function copyMine(){ if(!me){ toast('請先在上方選「我是誰」'); return; } doCopy(report([me])); }
function copyAll(){ doCopy(report(PLAN.map(p=>p.key))); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.className='toast show'; setTimeout(()=>t.className='toast',1800); }

render();
pull();
setInterval(pull, 15000);   // 每 15 秒拉一次別人的更新
</script>
</body>
